# @package _global_

defaults:
  - /benchmark/nav/vln_r2r
  - /habitat/task/measurements:
    - top_down_map
    - ndtw
  - _self_

habitat:
  environment:
    max_episode_steps: 500

  simulator:
    forward_step_size: 0.25
    turn_angle: 30

    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: True

    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            type: HabitatSimRGBSensor
            width: 640
            height: 480
            hfov: 120
            position: [0.0, 1.25, 0.0]

  task:
    actions:
      no_op:
        type: NoOpAction

    measurements:
      success:
        success_distance: 3.0
      trajectory_Length:
        type: TrajectoryLength
      oracle_navigation_error:
        type: OracleNavigationError
      oracle_success:
        type: OracleSuccess
      ndtw:
        type: NDTW
        SPLIT: ${habitat.dataset.split}
        GT_PATH: "VLN-CE/datasets/rxr/{split}/{split}_guide_gt.json.gz"
        SUCCESS_DISTANCE: 3.0
        FDTW: False

  dataset:
    type: RxR-VLN-CE-v1
    split: None
    scenes_dir: "/path/to/scene_dir"
    data_path: "/path/to/data_path"
