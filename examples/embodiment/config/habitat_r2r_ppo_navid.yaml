defaults:
  - env/habitat_r2r@env.train
  - env/habitat_r2r@env.eval
  - model/navid@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 1

runner:
  task_type: embodied
  logger:
    log_path: "logs"
    project_name: rlinf
    experiment_name: "habitat_r2r_ppo_navid"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  eval_policy_path: null # Optional: .pt file or None, if None, will use the checkpoint in rollout.model.model_path
  val_check_interval: -1
  save_interval: 25

  resume_dir: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1 # set eval_rollout_epoch > 0 when enable runner.only_eval or runner.val_check_interval > 0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean" 
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  # params for generation
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  # length argument for autoregressive sampling
  # max length means max amount of tokens to generate
  length_params:
    max_new_token: 512
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False
  
  # Override the default values in env/habitat_r2r
  train:
    total_num_envs: 3  # Total number of parallel environments for training
    max_steps_per_rollout_epoch: 3
    max_episode_steps: 3 # max episode steps for truncation
    reset_gripper_open: False
    video_cfg:
      fps: 5
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/train
    metrics_cfg:
      save_metrics: True
      metrics_base_dir: ${runner.logger.log_path}/metrics/train
    init_params:
      config_path: "rlinf/envs/habitat/extensions/config/vlnce_r2r_navid.yaml"
  eval:
    total_num_envs: 114
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 6402
    group_size: 1
    video_cfg:
      fps: 5
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    metrics_cfg:
      save_metrics: True
      metrics_base_dir: ${runner.logger.log_path}/metrics/eval
    init_params:
      config_path: "rlinf/envs/habitat/extensions/config/vlnce_r2r_navid.yaml"

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "VLN-CE/models/navid_weights/NaVid/navid-7b-full-224-video-fps-1-grid-2-r2r-rxr-training-split"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 3
  seed: 1234
  enable_offload: False

  # Override the default values in model/navid
  model:
    model_path: "VLN-CE/models/navid_weights/NaVid/navid-7b-full-224-video-fps-1-grid-2-r2r-rxr-training-split"
    add_value_head: True
    max_prompt_length: 1024

  optim:
    lr: 2.0e-5
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False
    cpu_offload: False
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
