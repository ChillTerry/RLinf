defaults:
  - env/habitat_r2r@env.train
  - env/habitat_r2r@env.eval
  - model/cma@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 4-7

runner:
  task_type: embodied
  weight_sync_interval: 1
  logger:
    log_path: "logs"
    project_name: rlinf
    experiment_name: "habitat_r2r_grpo_cma"
    logger_backends: ["tensorboard"]

  max_epochs: 500
  max_steps: -1

  only_eval: False
  val_check_interval: 10
  save_interval: -1
  save_best_only: True
  best_metric: success
  best_metric_mode: max

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl

  update_epoch: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1
  group_size: 8

  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  success_reward_coef: 10.0
  ndtw_reward_coef: 5.0
  filter_rewards: True
  rewards_lower_bound: 1.0
  rewards_upper_bound: 12.0

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.2
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null

env:
  group_name: "EnvGroup"
  enable_offload: False
  data_path_dir: "VLN-CE/datasets/r2r"
  scenes_dir: "VLN-CE/scene_dataset"

  train:
    total_num_envs: 128
    max_episode_steps: 128
    max_steps_per_rollout_epoch: 128
    group_size: ${algorithm.group_size}
    model_type: ${actor.model.model_type}
    success_reward_coef: ${algorithm.success_reward_coef}
    ndtw_reward_coef: ${algorithm.ndtw_reward_coef}
    split: train
    scenes_dir: ${env.scenes_dir}
    data_path: ${env.data_path_dir}/${env.train.split}/${env.train.split}.json.gz
    ndtw_gt_path: ${env.data_path_dir}/${env.train.split}/${env.train.split}_gt.json.gz
    init_params:
      config_path: "rlinf/envs/habitat/extensions/config/vlnce_r2r_cma.yaml"
    metrics_cfg:
      save_metrics: False
      metrics_base_dir: ${runner.logger.log_path}/metrics/train
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    total_num_envs: 112
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 1600
    group_size: 1
    auto_reset: True
    ignore_terminations: True
    model_type: ${actor.model.model_type}
    success_reward_coef: ${algorithm.success_reward_coef}
    ndtw_reward_coef: ${algorithm.ndtw_reward_coef}
    split: val_unseen
    scenes_dir: ${env.scenes_dir}
    data_path: ${env.data_path_dir}/${env.eval.split}/${env.eval.split}.json.gz
    ndtw_gt_path: ${env.data_path_dir}/${env.eval.split}/${env.eval.split}_gt.json.gz
    init_params:
      config_path: "rlinf/envs/habitat/extensions/config/vlnce_r2r_cma.yaml"
    metrics_cfg:
      save_metrics: False
      metrics_base_dir: ${runner.logger.log_path}/metrics/eval
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  collect_prev_infos: True
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: "VLN-CE/models/cma_weights/ckpt/best_ckpt_r2r.pth"
    instruction_encoder_config:
      embedding_file: "VLN-CE/models/cma_weights/instruction_encoder_embedding/embeddings.json.gz"
    depth_encoder_config:
      ddppo_checkpoint: "VLN-CE/models/cma_weights/ddppo-models/gibson-2plus-resnet50.pth"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 1024
  seed: 42
  enable_offload: True

  model:
    model_path: "VLN-CE/models/cma_weights/ckpt/best_ckpt_r2r.pth"
    instruction_encoder_config:
      embedding_file: "VLN-CE/models/cma_weights/instruction_encoder_embedding/embeddings.json.gz"
    depth_encoder_config:
      ddppo_checkpoint: "VLN-CE/models/cma_weights/ddppo-models/gibson-2plus-resnet50.pth"

  optim:
    lr: 5.0e-6
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
