# CMA Policy Configuration

model_type: "cma"
precision: "fp32"
load_to_device: True

action_dim: 1
num_action_classes: 4
num_action_chunks: 1

model_path: ""

image_size: [256, 256, 3]

add_value_head: True
add_q_head: False
q_head_type: "default"
num_q_heads: 2

independent_std: True
action_scale: null
final_tanh: False
std_range: null
logstd_range: null

instruction_encoder_config:
  sensor_uuid: "instruction"
  vocab_size: 2504
  use_pretrained_embeddings: True
  embedding_file: ""
  fine_tune_embeddings: True
  embedding_size: 50
  hidden_size: 128
  rnn_type: "LSTM"
  final_state_only: False
  bidirectional: True

depth_encoder_config:
  cnn_type: "VlnResnetDepthEncoder"
  output_size: 128
  backbone: "resnet50"
  ddppo_checkpoint: ""
  trainable: True

rgb_encoder_config:
  cnn_type: "TorchVisionResNet50"
  output_size: 256
  trainable: True

state_encoder_config:
  hidden_size: 512
  rnn_type: "GRU"

hidden_size: 512
normalize_rgb: False
ablate_instruction: False
ablate_depth: False
ablate_rgb: False

use_progress_monitor: False
progress_monitor_alpha: 1.0

is_lora: False
