go2_vln_executor:
  ros__parameters:
    action_name: "/go2_vln/execute_nav_primitive"
    sport_request_topic: "/api/sport/request"
    sport_state_topic: "/sportmodestate"
    pointcloud_topic: "/utlidar/cloud_base"
    heartbeat_topic: "/go2_vln/heartbeat"
    estop_topic: "/go2_vln/estop"

    forward_distance_m: 0.25
    turn_angle_rad: 0.5235987756
    distance_tolerance_m: 0.025
    yaw_tolerance_rad: 0.0523598776
    forward_speed_mps: 0.3
    yaw_speed_radps: 1.2
    command_rate_hz: 20.0
    action_timeout_sec: 8.0
    state_timeout_sec: 0.5
    heartbeat_timeout_sec: 1.0

    enable_pointcloud_obstacle_check: false
    obstacle_min_x_m: 0.05
    obstacle_max_x_m: 0.60
    obstacle_half_width_m: 0.35
    obstacle_min_z_m: -0.30
    obstacle_max_z_m: 0.50
    obstacle_min_points: 3
